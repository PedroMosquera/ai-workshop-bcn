<div class="reveal">
    <table class="board" aria-label="Team checkpoint status">
        <thead><tr><th>Team</th><th>CP1 · Spec</th><th>CP2 · Booking</th><th>CP3 · Rules</th><th>CP4 · Demo</th></tr></thead>
        <tbody id="boardBody"></tbody>
    </table>
</div>
<div class="board-legend reveal">
    <span>Click a cell to cycle:</span>
    <span>- not yet</span>
    <span class="b">in progress</span>
    <span class="g">done</span>
    <span class="o">need help</span>
    <span>· click a team name to rename it</span>
    <button id="boardReset" type="button">clear board</button>
</div>
