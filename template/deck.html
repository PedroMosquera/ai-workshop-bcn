<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* === FONTS: DTFlow inlined so the deck works offline === */
@font-face { font-family: 'DTFlow'; src: url(data:font/opentype;base64,{{base64:assets/dtflow-1.otf}}) format('opentype'); font-weight: 100; font-display: swap; }
@font-face { font-family: 'DTFlow'; src: url(data:font/opentype;base64,{{base64:assets/dtflow-2.otf}}) format('opentype'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'DTFlow'; src: url(data:font/opentype;base64,{{base64:assets/dtflow-3.otf}}) format('opentype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'DTFlow'; src: url(data:font/opentype;base64,{{base64:assets/dtflow-4.otf}}) format('opentype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'DTFlow'; src: url(data:font/opentype;base64,{{base64:assets/dtflow-5.otf}}) format('opentype'); font-weight: 600; font-display: swap; }

/* === THEME TOKENS: Dynatrace Corporate 2026. Dark is DT Tech Dark, light is DT Card Bright ===
   A -text token is a tint (dark) or shade (light) of its palette colour, used only where the
   palette colour itself fails WCAG AA as text on that background. */
:root {
    --bg: #0F1628;
    --bg-gradient: radial-gradient(1200px 600px at 100% 0%, rgba(59,172,240,.10), transparent 60%),
                   radial-gradient(900px 500px at 0% 100%, rgba(73,194,179,.08), transparent 60%),
                   linear-gradient(180deg, #0F1628 0%, #1A2440 100%);
    --grid-line: rgba(255,255,255,.035);
    --text: #FFFFFF;
    --text-2: #B0B5BD;
    --text-3: #90959E;
    --card: #1A2440;
    --card-border: #2E3A56;
    --card-shadow: none;
    --code-bg: #0F1628;
    --teal: #49C2B3;
    --teal-text: #49C2B3;
    --blue: #1966FF;
    --blue-text: #3BACF0;
    --purple: #5E28E5;
    --purple-text: #AF94F2;
    --pink: #C93FDB;
    --pink-text: #D979E6;
    --spectrum: linear-gradient(90deg, #49C2B3, #3BACF0, #1966FF, #5E28E5, #8D1CDC, #C93FDB);
    --tag-bg: rgba(73,194,179,.14);
    --hl-pink: rgba(201,63,219,.16);
    --font: 'DTFlow', 'DM Sans', Arial, Helvetica, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"] {
    --bg: #F9FAFB;
    --bg-gradient: radial-gradient(1200px 600px at 100% 0%, rgba(25,102,255,.05), transparent 60%),
                   radial-gradient(900px 500px at 0% 100%, rgba(73,194,179,.06), transparent 60%),
                   linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
    --grid-line: rgba(26,36,64,.035);
    --text: #1A2440;
    --text-2: #6F747F;
    --text-3: #6F747F;
    --card: #FFFFFF;
    --card-border: #E5E7EB;
    --card-shadow: 0 2px 8px rgba(26,36,64,.06);
    --code-bg: #1A2440;
    --teal-text: #327379;
    --blue-text: #1966FF;
    --purple-text: #5E28E5;
    --pink-text: #8D1CDC;
    --hl-pink: rgba(201,63,219,.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* === VIEWPORT BASE (from dt-slides viewport-base.css) === */
/* overflow-x on body would make body the scroller and silently disable the snap set on html */
html { height: 100%; overflow-x: hidden; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { min-height: 100%; }
.slide {
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; scroll-snap-align: start;
    display: flex; flex-direction: column; position: relative;
}
.slide-content {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    max-height: 100%; overflow: hidden; padding: var(--slide-padding);
    /* Optical centre: sit a little above the middle, which reads as centred */
    transform: translateY(-4vh);
}
:root {
    --title-size: clamp(1.5rem, 5vw, 4rem);
    --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
    --h3-size: clamp(1rem, 2.5vw, 1.75rem);
    --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
    --small-size: clamp(0.65rem, 1vw, 0.875rem);
    --slide-padding: clamp(1rem, 4vw, 4rem);
    --content-gap: clamp(0.5rem, 2vw, 2rem);
    --element-gap: clamp(0.25rem, 1vw, 1rem);
}
/* Above about a 1230x670 window every rem size grows with the window, limited by its height so slides don't overflow */
html { font-size: max(100%, min(1.3vw, 2.4vh)); }
.card, .container, .content-box { max-width: min(90vw, 62.5rem); max-height: min(80vh, 43.75rem); }
.feature-list, .bullet-list { gap: clamp(0.4rem, 1vh, 1rem); }
.feature-list li, .bullet-list li { font-size: var(--body-size); line-height: 1.4; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: clamp(0.5rem, 1.5vw, 1rem); }
img, .image-container { max-width: 100%; max-height: min(50vh, 400px); object-fit: contain; }
@media (max-height: 700px) {
    :root { --slide-padding: clamp(0.75rem, 3vw, 2rem); --content-gap: clamp(0.4rem, 1.5vw, 1rem); --title-size: clamp(1.25rem, 4.5vw, 2.5rem); --h2-size: clamp(1rem, 3vw, 1.75rem); }
}
@media (max-height: 600px) {
    :root { --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem); --content-gap: clamp(0.3rem, 1vw, 0.75rem); --title-size: clamp(1.1rem, 4vw, 2rem); --body-size: clamp(0.7rem, 1.2vw, 0.95rem); }
    .nav-dots, .keyboard-hint, .decorative { display: none; }
}
@media (max-height: 500px) {
    :root { --slide-padding: clamp(0.4rem, 2vw, 1rem); --title-size: clamp(1rem, 3.5vw, 1.5rem); --h2-size: clamp(0.9rem, 2.5vw, 1.25rem); --body-size: clamp(0.65rem, 1vw, 0.85rem); }
}
@media (max-width: 600px) {
    :root { --title-size: clamp(1.25rem, 7vw, 2.5rem); }
    .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
    html { scroll-behavior: auto; }
}

/* === BASE === */
body {
    font-family: var(--font); font-weight: 300; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; transition: background .3s, color .3s;
}
.slide { background: var(--bg-gradient); }
.slide::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
.slide-content { position: relative; z-index: 1; gap: var(--content-gap); max-width: 80rem; width: 100%; margin: 0 auto; }

h1 { font-size: var(--title-size); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
h2 { font-size: var(--h2-size); font-weight: 500; line-height: 1.1; letter-spacing: -0.015em; }
h3 { font-size: var(--h3-size); font-weight: 500; line-height: 1.2; }
p, li { font-size: var(--body-size); color: var(--text-2); line-height: 1.5; }
strong { color: var(--text); font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: .92em; }
:not(pre) > code { background: var(--card); border: 1px solid var(--card-border); padding: .05em .35em; border-radius: 4px; color: var(--text); }

.g { color: var(--teal-text); }
.b { color: var(--blue-text); }
.o { color: var(--pink-text); }
.hl-pink { background: var(--hl-pink); padding: 0 .25em; border-radius: 3px; color: var(--text); }

.eyebrow {
    font-family: var(--mono); font-size: var(--small-size); letter-spacing: .12em; text-transform: uppercase;
    color: var(--teal-text); display: flex; align-items: center; gap: .6em;
}
.eyebrow::before { content: ""; width: 1.6em; height: 2px; background: var(--teal); }
.lede { font-size: clamp(0.85rem, 1.8vw, 1.35rem); color: var(--text-2); max-width: 62ch; line-height: 1.45; }
.small { font-size: var(--small-size); color: var(--text-3); }

.card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    box-shadow: var(--card-shadow); padding: clamp(0.6rem, 1.4vw, 1.25rem);
    display: flex; flex-direction: column; gap: clamp(0.25rem, .6vw, .5rem); max-width: none;
}
.card h3 { font-size: clamp(0.85rem, 1.6vw, 1.2rem); }
.card p, .card li { font-size: clamp(0.72rem, 1.15vw, 0.95rem); }
.card.accent-g { border-left: 3px solid var(--teal); }
.card.accent-b { border-left: 3px solid var(--blue); }
.card.accent-v { border-left: 3px solid var(--purple); }
.card.accent-o { border-left: 3px solid var(--pink); }

.tag {
    display: inline-block; font-family: var(--mono); font-size: var(--small-size);
    background: var(--tag-bg); color: var(--teal-text); padding: .15em .6em; border-radius: 999px; width: fit-content;
}
.tag.b { background: rgba(25,102,255,.13); color: var(--blue-text); }
.tag.v { background: rgba(94,40,229,.13); color: var(--purple-text); }
.tag.o { background: rgba(201,63,219,.13); color: var(--pink-text); }

.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--content-gap); align-items: start; }
.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(0.5rem, 1.5vw, 1rem); }
.cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(0.5rem, 1.5vw, 1rem); }
@media (max-width: 800px) { .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr; } }

.bullet-list { list-style: none; display: flex; flex-direction: column; }
.bullet-list li { position: relative; padding-left: 1.4em; }
.bullet-list li::before {
    content: ""; position: absolute; left: 0; top: .55em; width: .5em; height: .5em;
    border-radius: 2px; background: var(--teal);
}
.bullet-list.o li::before { background: var(--pink); }

pre {
    background: var(--code-bg); color: #E6E8EB; border: 1px solid var(--card-border); border-radius: 12px;
    padding: clamp(0.6rem, 1.4vw, 1.1rem) clamp(0.8rem, 1.6vw, 1.3rem);
    font-family: var(--mono); font-size: clamp(0.62rem, 1.05vw, 0.88rem); line-height: 1.6;
    white-space: pre-wrap; overflow: hidden; box-shadow: 0 0 40px rgba(25,102,255,.08);
}
pre .k { color: #49C2B3; } pre .s { color: #3BACF0; } pre .w { color: #D979E6; } pre .p { color: #AF94F2; }

/* === PHOTOS: ![caption](photos/x.webp), side by side inside ::: photos === */
.photos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: clamp(0.5rem, 1.5vw, 1rem); }
.photo { margin: 0; display: flex; flex-direction: column; gap: .5em; }
.photo img {
    width: 100%; max-height: 46vh; aspect-ratio: 4 / 3; object-fit: cover;
    border: 1px solid var(--card-border); border-radius: 12px; box-shadow: var(--card-shadow);
}
.photo figcaption { font-size: var(--small-size); color: var(--text-2); }

/* === TITLE / SECTION SLIDES === */
.title-slide h1 { font-size: clamp(2rem, 7vw, 5.5rem); max-width: 15ch; }
.title-slide h1 .g { color: var(--teal); }
[data-theme="light"] .title-slide h1 .g { color: var(--teal-text); }
.meta-row { display: flex; flex-wrap: wrap; gap: clamp(.4rem, 1vw, .8rem); }
.meta-row .tag { font-size: clamp(.65rem, 1vw, .85rem); }

/* === CHECKPOINT TIMELINE === */
.cp-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cp-step { display: flex; flex-direction: column; gap: .45em; }
.cp-step .bar { height: 6px; border-radius: 3px; background: var(--teal); }
.cp-step:nth-child(2) .bar { background: var(--blue); }
.cp-step:nth-child(3) .bar { background: var(--purple); }
.cp-step:nth-child(4) .bar { background: var(--pink); }
.cp-step .when { font-family: var(--mono); font-size: var(--small-size); color: var(--text-3); }
.cp-step .name { font-size: clamp(.8rem, 1.3vw, 1.05rem); font-weight: 600; color: var(--text); }
.cp-step .what { font-size: clamp(.66rem, 1vw, .86rem); color: var(--text-2); line-height: 1.4; }
@media (max-width: 800px) { .cp-track { grid-template-columns: 1fr 1fr; gap: .8rem; } }

/* === CHECKPOINT DETAIL SLIDES === */
.cp-layout { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: var(--content-gap); align-items: center; }
.cp-meta { display: flex; gap: .5rem; flex-wrap: wrap; }
.cp-left { display: flex; flex-direction: column; gap: clamp(.4rem, 1.2vh, .9rem); }
.cp-right { display: flex; flex-direction: column; gap: clamp(.45rem, 1.2vh, .8rem); }
@media (max-width: 800px) { .cp-layout { grid-template-columns: 1fr; } }

.checklist { list-style: none; display: flex; flex-direction: column; gap: clamp(.3rem, .9vh, .6rem); }
.checklist li { display: grid; grid-template-columns: auto 1fr; gap: .7em; align-items: start; }
.checklist .box { width: 1.1em; height: 1.1em; border: 1.5px solid var(--cp-color, var(--teal)); border-radius: 4px; margin-top: .2em; }

/* === STATUS BOARD === */
.board { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
.board th { font-family: var(--mono); font-size: var(--small-size); font-weight: 500; color: var(--text-3); text-align: center; padding: .2em; }
.board th:first-child { text-align: left; width: 18%; }
.board td.team {
    font-size: clamp(.72rem, 1.1vw, .95rem); font-weight: 600; color: var(--text);
    padding: .35em .6em; border-radius: 6px; outline: none;
}
.board td.team:focus { background: var(--card); box-shadow: inset 0 0 0 1px var(--blue); }
.board td.cell { padding: 0; }
.board button.st {
    width: 100%; height: clamp(26px, 4.6vh, 40px); border-radius: 6px; cursor: pointer;
    border: 1px solid var(--card-border); background: var(--card); color: var(--text-3);
    display: flex; align-items: center; justify-content: center; gap: .4em;
    font-family: var(--mono); font-size: clamp(.6rem, .9vw, .78rem);
}
.board button.st svg { width: 1.05em; height: 1.05em; flex-shrink: 0; }
.board button.st .i-wip, .board button.st .i-done, .board button.st .i-help { display: none; }
.board button.st[data-s="wip"] { border-color: var(--blue); color: var(--text); }
.board button.st[data-s="wip"] .i-wip { display: block; color: var(--blue-text); }
.board button.st[data-s="done"] { border-color: var(--teal); background: rgba(73,194,179,.14); color: var(--text); }
.board button.st[data-s="done"] .i-done { display: block; color: var(--teal-text); }
.board button.st[data-s="help"] { border-color: var(--pink); background: rgba(201,63,219,.12); color: var(--text); }
.board button.st[data-s="help"] .i-help { display: block; color: var(--pink-text); }
.board-legend { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
.board-legend span { font-family: var(--mono); font-size: var(--small-size); color: var(--text-3); }
.board-legend span.b { color: var(--blue-text); } .board-legend span.g { color: var(--teal-text); } .board-legend span.o { color: var(--pink-text); }
.board-legend button {
    font-family: var(--mono); font-size: var(--small-size); color: var(--text-3); background: none;
    border: 1px solid var(--card-border); border-radius: 6px; padding: .2em .6em; cursor: pointer; margin-left: auto;
}

/* === BRAND CHROME: background images (dark only), logo placement, gradient bar === */
{{deck_css}}
.bg-overlay { display: none; position: absolute; inset: 0; background: rgba(26,36,64,var(--bg-overlay-opacity,.55)); z-index: 0; pointer-events: none; }
[data-theme="dark"] .slide.bg-img { background-size: cover; background-position: center; background-attachment: fixed; }
[data-theme="dark"] .slide.bg-img::before { display: none; }
[data-theme="dark"] .slide.bg-img .bg-overlay { display: block; }
[data-theme="dark"] .slide.bg-title {
    background: linear-gradient(135deg, #1A2440 0%, #222E4A 50%, #1A2440 100%);
    background-image: url(data:image/webp;base64,{{base64:assets/bg-title.webp}});
    --bg-overlay-opacity: .5;
}
[data-theme="dark"] .slide.bg-closing {
    background: linear-gradient(135deg, #1A2440, #222E4A);
    background-image: url(data:image/webp;base64,{{base64:assets/bg-closing.webp}});
    --bg-overlay-opacity: .55;
}
.brand-mark { position: absolute; left: var(--slide-padding); top: var(--slide-padding); z-index: 1; }
.brand-mark svg { width: clamp(100px, 11vw, 140px); height: auto; color: var(--text); display: block; }
[data-theme="dark"] .brand-mark svg path { fill: #FFFFFF; }
/* bottom-left on bright slides, lifted clear of the fixed pager */
[data-theme="light"] .brand-mark { top: auto; bottom: calc(var(--slide-padding) + 28px); }
[data-theme="light"] .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--spectrum); }

/* === ANIMATION === */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(2) { transition-delay: .08s; }
.slide.visible .reveal:nth-child(3) { transition-delay: .16s; }
.slide.visible .reveal:nth-child(4) { transition-delay: .24s; }
.slide.visible .reveal:nth-child(5) { transition-delay: .32s; }
.stagger > * { opacity: 0; transform: translateY(16px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
.slide.visible .stagger > * { opacity: 1; transform: none; }
.slide.visible .stagger > *:nth-child(2) { transition-delay: .07s; }
.slide.visible .stagger > *:nth-child(3) { transition-delay: .14s; }
.slide.visible .stagger > *:nth-child(4) { transition-delay: .21s; }
.slide.visible .stagger > *:nth-child(5) { transition-delay: .28s; }
.slide.visible .stagger > *:nth-child(6) { transition-delay: .35s; }

/* === CHROME: progress, dots, counter, toolbar, notes === */
.progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--spectrum); z-index: 100; width: 0; transition: width .3s var(--ease); }
.nav-dots { position: fixed; right: clamp(.5rem, 1.2vw, 1.2rem); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 7px; z-index: 100; }
.nav-dots button { width: 7px; height: 7px; border-radius: 50%; border: none; background: var(--card-border); cursor: pointer; padding: 0; transition: transform .2s, background .2s; }
.nav-dots button.active { background: var(--teal); transform: scale(1.5); }
.pager { position: fixed; left: clamp(.6rem, 1.5vw, 1.4rem); bottom: clamp(.5rem, 1.2vw, 1rem); display: flex; align-items: center; gap: 6px; z-index: 100; }
.pager button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--card-border); background: var(--card);
    color: var(--text-2); cursor: pointer; display: grid; place-items: center; opacity: .7; padding: 0;
}
.pager button:hover:not(:disabled) { opacity: 1; }
.pager button:disabled { opacity: .25; cursor: default; }
.pager svg { width: 14px; height: 14px; }
.slide-counter { font-family: var(--mono); font-size: 11px; color: var(--text-3); min-width: 6ch; text-align: center; }
.toolbar { position: fixed; top: clamp(.5rem, 1.2vw, 1rem); right: clamp(.5rem, 1.2vw, 1rem); display: flex; gap: 6px; z-index: 101; }
.toolbar button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--card);
    color: var(--text-2); cursor: pointer; display: grid; place-items: center; opacity: .55; transition: opacity .2s;
}
.toolbar button:hover, .toolbar button:focus-visible { opacity: 1; }
.toolbar svg { width: 16px; height: 16px; }
[data-theme="dark"] .i-sun { display: block; } [data-theme="dark"] .i-moon { display: none; }
[data-theme="light"] .i-sun { display: none; } [data-theme="light"] .i-moon { display: block; }
.keyboard-hint { position: fixed; right: clamp(.6rem, 1.5vw, 1.4rem); bottom: clamp(.5rem, 1.2vw, 1rem); font-family: var(--mono); font-size: 11px; color: var(--text-3); z-index: 100; }
aside.notes { display: none; }
.notes-panel {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%); width: min(920px, 96vw);
    max-height: 42vh; overflow: auto; background: var(--card); border: 1px solid var(--card-border); border-bottom: none;
    border-radius: 12px 12px 0 0; padding: 1rem 1.25rem; z-index: 102; transition: transform .3s var(--ease);
    box-shadow: 0 -8px 32px rgba(0,0,0,.25);
}
.notes-panel.open { transform: translate(-50%, 0); }
.notes-panel h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-text); margin-bottom: .5rem; }
.notes-panel p, .notes-panel li { font-size: 14px; color: var(--text-2); }
.notes-panel ul { padding-left: 1.1rem; display: flex; flex-direction: column; gap: .25rem; }

@media print { .toolbar, .nav-dots, .progress-bar, .keyboard-hint, .notes-panel, .pager { display: none !important; } .reveal, .stagger > * { opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>

<div class="progress-bar" aria-hidden="true"></div>
<nav class="nav-dots" aria-label="Slides"></nav>
<div class="toolbar">
    <button id="notesBtn" title="Organizer notes (N)" aria-label="Toggle organizer notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>
    </button>
    <button id="themeBtn" title="Dark / bright theme (T)" aria-label="Toggle theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
</div>
<nav class="pager" aria-label="Pagination">
    <button id="prevBtn" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="slide-counter" aria-live="polite"></span>
    <button id="nextBtn" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</nav>
<div class="keyboard-hint">arrows · ?slide=N · T theme · N notes · F fullscreen</div>
<div class="notes-panel" id="notesPanel" role="region" aria-label="Organizer notes"><h4>Organizer notes</h4><div id="notesBody"></div></div>

<main>
{{slides}}
</main>

<script>
/* === PRESENTATION CONTROLLER === */
class SlidePresentation {
    constructor() {
        this.slides = [...document.querySelectorAll('.slide')];
        this.current = 0;
        this.progress = document.querySelector('.progress-bar');
        this.counter = document.querySelector('.slide-counter');
        this.notesPanel = document.getElementById('notesPanel');
        this.notesBody = document.getElementById('notesBody');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.buildDots();
        this.restoreTheme();
        // Jump before observing, so the observer's first report is the requested slide, not slide 1.
        const start = this.slideFromQuery();
        if (start > 0) this.slides[start].scrollIntoView({ behavior: 'instant' });
        this.observe();
        this.bindKeys();
        this.bindToolbar();
        this.update(start);
    }

    slideFromQuery() {
        const n = parseInt(new URLSearchParams(location.search).get('slide'), 10);
        return Number.isFinite(n) ? Math.max(0, Math.min(this.slides.length - 1, n - 1)) : 0;
    }

    syncQuery(i) {
        try {
            const url = new URL(location.href);
            if (url.searchParams.get('slide') === String(i + 1)) return;
            url.searchParams.set('slide', i + 1);
            history.replaceState(null, '', url);
        } catch (_) {}
    }

    buildDots() {
        const nav = document.querySelector('.nav-dots');
        this.dots = this.slides.map((s, i) => {
            const b = document.createElement('button');
            b.setAttribute('aria-label', `Go to slide ${i + 1}`);
            b.addEventListener('click', () => this.go(i));
            nav.appendChild(b);
            return b;
        });
    }

    observe() {
        const io = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    this.update(this.slides.indexOf(e.target));
                }
            });
        }, { threshold: 0.55 });
        this.slides.forEach(s => io.observe(s));
    }

    update(i) {
        this.current = i;
        this.dots.forEach((d, j) => d.classList.toggle('active', j === i));
        this.progress.style.width = `${((i + 1) / this.slides.length) * 100}%`;
        this.counter.textContent = `${String(i + 1).padStart(2, '0')} / ${this.slides.length}`;
        this.prevBtn.disabled = i === 0;
        this.nextBtn.disabled = i === this.slides.length - 1;
        this.syncQuery(i);
        const notes = this.slides[i].querySelector('aside.notes');
        this.notesBody.innerHTML = notes ? notes.innerHTML : '<p>No notes for this slide.</p>';
    }

    go(i) {
        const target = Math.max(0, Math.min(this.slides.length - 1, i));
        this.update(target);
        this.slides[target].scrollIntoView({ behavior: 'smooth' });
    }

    bindKeys() {
        document.addEventListener('keydown', e => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.target.isContentEditable || e.target.tagName === 'BUTTON') return;
            const k = e.key;
            if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(k)) { e.preventDefault(); this.go(this.current + 1); }
            else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); this.go(this.current - 1); }
            else if (k === 'Home') { e.preventDefault(); this.go(0); }
            else if (k === 'End') { e.preventDefault(); this.go(this.slides.length - 1); }
            else if (k === 't' || k === 'T') this.toggleTheme();
            else if (k === 'n' || k === 'N') this.notesPanel.classList.toggle('open');
            else if (k === 'f' || k === 'F') this.toggleFullscreen();
        });
    }

    bindToolbar() {
        document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());
        document.getElementById('notesBtn').addEventListener('click', () => this.notesPanel.classList.toggle('open'));
        document.getElementById('fsBtn').addEventListener('click', () => this.toggleFullscreen());
        this.prevBtn.addEventListener('click', () => this.go(this.current - 1));
        this.nextBtn.addEventListener('click', () => this.go(this.current + 1));
    }

    toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('ws-theme', next); } catch (_) {}
    }

    restoreTheme() {
        try {
            const saved = localStorage.getItem('ws-theme');
            if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
        } catch (_) {}
    }

    toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
    }
}

{{deck_js}}
new SlidePresentation();
</script>
</body>
</html>
